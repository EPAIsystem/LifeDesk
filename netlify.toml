[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID"

[functions."check-renewals"]
  schedule = "@daily"

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/admin-stats"
  to = "/.netlify/functions/admin-stats"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
